name: CI

on:
  push:
    branches: [main]
  pull_request:

# Kirigami 6.29 needs Qt 6.9 and KDE Frameworks 6.10, which no Ubuntu runner
# image carries, so the build runs in an Arch container instead.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: Install Qt 6 and KDE Frameworks 6
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake extra-cmake-modules ninja \
            qt6-base qt6-declarative qt6-svg \
            kirigami kirigami-addons ki18n kcoreaddons kconfig kcrash \
            kitemmodels ksyntaxhighlighting kcolorscheme kiconthemes \
            qqc2-desktop-style breeze-icons \
            appstream desktop-file-utils

      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      # The suites are deliberately window-free, but offscreen costs nothing
      # and keeps them honest once QML tests arrive.
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
